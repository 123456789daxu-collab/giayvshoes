<div th:fragment="pagination(pageData, baseUrl, keyword, trangThai)" class="table-footer d-flex justify-content-between align-items-center" style="padding: 16px 20px;">
    <div class="total-count text-muted" style="font-size: 13px;">
        Đang hiển thị <span th:text="${pageData.totalElements == 0 ? 0 : pageData.number * pageData.size + 1}" class="fw-bold text-dark"></span>-<span th:text="${(pageData.number * pageData.size) + pageData.numberOfElements}" class="fw-bold text-dark"></span> trong tổng số <span th:text="${pageData.totalElements}" class="fw-bold text-dark"></span> kết quả
    </div>
    <div style="display: flex; align-items: center; gap: 16px;" th:if="${pageData.totalElements > 0}">
        <div class="page-size-selector" style="display: flex; align-items: center; gap: 8px;">
            <span style="font-size: 13px; color: #64748b; font-weight: 500;">Hiển thị</span>
            <select class="form-select form-select-sm page-size-select" style="width: auto; border-radius: 6px; font-size: 13px; font-weight: 500; cursor: pointer; color: #0f172a; height: 32px;" 
                    th:data-url="@{${baseUrl}(keyword=${keyword},trangThai=${trangThai})}" 
                    onchange="let url = this.getAttribute('data-url'); window.location.href = url + (url.includes('?') ? '&' : '?') + 'size=' + this.value;">
                <option value="5" th:selected="${pageData.size == 5}">5</option>
                <option value="10" th:selected="${pageData.size == 10}">10</option>
                <option value="20" th:selected="${pageData.size == 20}">20</option>
                <option value="50" th:selected="${pageData.size == 50}">50</option>
            </select>
        </div>
        <nav th:if="${pageData.totalPages > 1}">
            <ul class="pagination pagination-sm mb-0" style="gap: 4px;"
                th:with="startPage=${pageData.number <= 1 ? 0 : (pageData.number >= pageData.totalPages - 2 ? pageData.totalPages - 3 : pageData.number - 1)},
                         actualStartPage=${startPage < 0 ? 0 : startPage},
                         endPage=${pageData.totalPages <= 3 ? pageData.totalPages - 1 : actualStartPage + 2}">
                
                <li class="page-item" th:classappend="${pageData.first ? 'disabled' : ''}">
                    <a class="page-link page-btn" th:href="@{${baseUrl}(page=${pageData.number - 1}, size=${pageData.size}, keyword=${keyword}, trangThai=${trangThai})}">
                        <i class="bi bi-chevron-left" style="font-size: 12px;"></i>
                    </a>
                </li>
                
                <li class="page-item disabled" th:if="${actualStartPage > 0}">
                    <a class="page-link" href="#" style="border: none; background: transparent; color: #64748b;">...</a>
                </li>
                
                <li class="page-item" th:each="i : ${#numbers.sequence(actualStartPage, endPage)}" th:classappend="${pageData.number == i ? 'active' : ''}">
                    <a class="page-link page-btn" th:href="@{${baseUrl}(page=${i}, size=${pageData.size}, keyword=${keyword}, trangThai=${trangThai})}" th:text="${i + 1}"></a>
                </li>
                
                <li class="page-item disabled" th:if="${endPage < pageData.totalPages - 1}">
                    <a class="page-link" href="#" style="border: none; background: transparent; color: #64748b;">...</a>
                </li>
                
                <li class="page-item" th:classappend="${pageData.last ? 'disabled' : ''}">
                    <a class="page-link page-btn" th:href="@{${baseUrl}(page=${pageData.number + 1}, size=${pageData.size}, keyword=${keyword}, trangThai=${trangThai})}">
                        <i class="bi bi-chevron-right" style="font-size: 12px;"></i>
                    </a>
                </li>
            </ul>
        </nav>
    </div>
</div>
