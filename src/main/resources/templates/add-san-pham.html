<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thêm Sản Phẩm Mới</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Select2 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <link rel="stylesheet" th:href="@{/css/sidebar.css}">
    <style>
        body { background-color: #f8f9fa; margin: 0; padding: 0; }
        .main-content { margin-left: 260px; padding: 2rem; width: calc(100% - 260px); min-height: 100vh; }
        .card-custom { background: #fff; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); padding: 2rem; margin-bottom: 2rem; border: none; width: 100%; }
        .form-label { font-weight: 600; color: #334155; }
        .table-custom th { background-color: #f9fafb; color: #4b5563; border-bottom: 2px solid #e5e7eb; padding: 15px; text-align: center; font-weight: 600; text-transform: uppercase; font-size: 0.85rem; letter-spacing: 0.5px; }
        .table-custom td { vertical-align: middle; padding: 15px; border-bottom: 1px solid #f1f5f9; text-align: center; }
        .table-custom input.form-control { width: 150px; margin: 0 auto; text-align: center; }
        .btn-hoan-tat { background: linear-gradient(135deg, #0f2d4a 0%, #00adef 100%); color: white; font-weight: 600; padding: 10px 30px; border-radius: 8px; float: right; border: none; box-shadow: 0 4px 12px rgba(0, 173, 239, 0.2); transition: all 0.2s; }
        .btn-hoan-tat:hover { background: #00adef; color: white; box-shadow: 0 6px 20px rgba(0, 173, 239, 0.35); transform: translateY(-1px); }
        .section-title { font-size: 1.25rem; font-weight: 700; color: #0f172a; margin-bottom: 1.5rem; text-align: center; text-transform: uppercase; letter-spacing: 1px;}
        
        /* Làm to phần Select2 ra theo ý người dùng */
        .select2-container .select2-selection--multiple {
            min-height: 48px !important;
            padding: 4px 8px !important;
            border-radius: 6px !important;
            border: 1px solid #dee2e6 !important;
            display: flex;
            align-items: center;
        }
        .select2-container--default .select2-selection--multiple .select2-selection__choice {
            background-color: #f1f5f9;
            border: 1px solid #cbd5e1;
            padding: 4px 10px;
            font-size: 14px;
            border-radius: 4px;
        }
    
        /* Pill Tags */
        .pill-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .pill-label {
            border-radius: 50px;
            padding: 6px 16px;
            font-size: 14px;
            font-weight: 500;
            color: #475569;
            background-color: #f8fafc;
            border: 1px solid #cbd5e1;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            margin-bottom: 0;
        }
        .btn-check:checked + .pill-label {
            background-color: #111827;
            color: #ffffff;
            border-color: #111827;
            box-shadow: none;
        }
        .pill-label:hover {
            background-color: #e2e8f0;
        }

    </style>
</head>
<body>
    <div style="display: flex; width: 100%;">
        <!-- Sidebar -->
        <nav th:replace="~{sidebar/sidebar :: sidebar}"></nav>

        <main class="main-content">
            <form id="productForm" action="/san-pham/save-all" method="POST">
                
                <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom">
                    <h2 class="h4 mb-0 fw-bold text-dark" style="letter-spacing: -0.5px;">Thêm Sản Phẩm Mới</h2>
                </div>

                <div class="row g-4 d-flex align-items-stretch">
                    <!-- Cột trái (Thông tin chính) -->
                    <div class="col-lg-8 d-flex flex-column">
                        <div class="card bg-white border mb-4" style="border-radius: 8px; border-color: #e5e7eb !important;">
                            <div class="card-header bg-white border-bottom-0 pt-4 pb-2">
                                <h6 class="fw-bold mb-0 text-dark text-uppercase" style="font-size: 0.85rem; letter-spacing: 0.5px;">Thông tin cơ bản</h6>
                            </div>
                            <div class="card-body p-4 pt-2">
                                <div class="mb-4">
                                    <label class="form-label fw-medium text-dark" style="font-size: 0.9rem;">Tên sản phẩm <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" name="tenSanPham" id="tenSanPham" placeholder="Nhập tên sản phẩm..." required style="border-radius: 6px; border-color: #d1d5db; padding: 10px 14px; transition: border-color 0.2s;">
                                    <div id="tenSanPhamError" class="text-danger mt-1 fw-medium" style="display: none; font-size: 0.85rem;"><i class="bi bi-exclamation-circle me-1"></i>Tên sản phẩm đã tồn tại! Vui lòng chọn tên khác.</div>
                                </div>
                                <div class="mb-2">
                                    <label class="form-label fw-medium text-dark" style="font-size: 0.9rem;">Mô tả sản phẩm</label>
                                    <textarea class="form-control" name="moTaChiTiet" rows="5" placeholder="Viết vài dòng mô tả..." style="border-radius: 6px; border-color: #d1d5db; padding: 10px 14px; resize: none;"></textarea>
                                </div>
                            </div>
                        </div>

                        <div class="card bg-white border mb-4" style="border-radius: 8px; border-color: #e5e7eb !important;">
                            <div class="card-header bg-white border-bottom-0 pt-4 pb-2">
                                <h6 class="fw-bold mb-0 text-dark text-uppercase" style="font-size: 0.85rem; letter-spacing: 0.5px;">Phân loại biến thể</h6>
                            </div>
                            <div class="card-body p-4 pt-2">
                                <div class="row g-4">
                                    <div class="col-md-6">
                                        <label class="form-label fw-medium text-dark" style="font-size: 0.9rem;">Màu sắc <span class="text-danger">*</span></label>
                                        <div class="input-group">
                                            <button class="btn text-start d-flex justify-content-between align-items-center flex-grow-1" type="button" id="dropdownColorBtn" data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-expanded="false" style="border: 1px solid #d1d5db; border-radius: 6px 0 0 6px; padding: 10px 14px; background-color: #fff;">
                                                <span id="selectedColorsText" class="text-muted" style="font-size: 0.9rem;">Chọn màu sắc...</span>
                                                <i class="bi bi-chevron-down text-muted"></i>
                                            </button>
                                            <div class="dropdown-menu p-3 shadow-sm border" style="width: 100%; max-height: 250px; overflow-y: auto; border-radius: 8px; border-color: #e5e7eb !important;">
                                                <div class="pill-group" id="colorGroup">
                                                    <th:block th:each="ms : ${listMauSac}">
                                                        <input type="checkbox" class="btn-check color-checkbox" th:id="'color_' + ${ms.id}" th:value="${ms.id}" th:data-name="${ms.tenMauSac}" autocomplete="off">
                                                        <label class="btn pill-label mb-1 d-inline-flex align-items-center gap-2" th:for="'color_' + ${ms.id}">
                                                            <span th:if="${ms.maMauSac != null && ms.maMauSac.startsWith('#')}" 
                                                                  th:style="'display: inline-block; width: 14px; height: 14px; border-radius: 50%; border: 1px solid #cbd5e1; background-color: ' + ${ms.maMauSac}"></span>
                                                            <span th:text="${ms.tenMauSac}"></span>
                                                        </label>
                                                    </th:block>
                                                </div>
                                            </div>
                                            <button class="btn btn-outline-secondary" type="button" onclick="promptAddNew('mau-sac', 'Màu Sắc')" style="border-radius: 0 6px 6px 0; border-color: #d1d5db;"><i class="bi bi-plus-lg"></i></button>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label fw-medium text-dark" style="font-size: 0.9rem;">Kích cỡ <span class="text-danger">*</span></label>
                                        <div class="input-group">
                                            <button class="btn text-start d-flex justify-content-between align-items-center flex-grow-1" type="button" id="dropdownSizeBtn" data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-expanded="false" style="border: 1px solid #d1d5db; border-radius: 6px 0 0 6px; padding: 10px 14px; background-color: #fff;">
                                                <span id="selectedSizesText" class="text-muted" style="font-size: 0.9rem;">Chọn kích cỡ...</span>
                                                <i class="bi bi-chevron-down text-muted"></i>
                                            </button>
                                            <div class="dropdown-menu p-3 shadow-sm border" style="width: 100%; max-height: 250px; overflow-y: auto; border-radius: 8px; border-color: #e5e7eb !important;">
                                                <div class="pill-group" id="sizeGroup">
                                                    <th:block th:each="cg : ${listCoGiay}">
                                                        <input type="checkbox" class="btn-check size-checkbox" th:id="'size_' + ${cg.id}" th:value="${cg.id}" th:data-name="${cg.sizeGiay}" autocomplete="off">
                                                        <label class="btn pill-label mb-1" th:for="'size_' + ${cg.id}" th:text="${cg.sizeGiay}"></label>
                                                    </th:block>
                                                </div>
                                            </div>
                                            <button class="btn btn-outline-secondary" type="button" onclick="promptAddNew('co-giay', 'Kích Cỡ')" style="border-radius: 0 6px 6px 0; border-color: #d1d5db;"><i class="bi bi-plus-lg"></i></button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- THIẾT LẬP CHUNG CHO BIẾN THỂ -->
                        <div class="card bg-white border mb-4" style="border-radius: 8px; border-color: #e5e7eb !important;">
                            <div class="card-header bg-white border-bottom-0 pt-4 pb-2">
                                <h6 class="fw-bold mb-0 text-dark text-uppercase" style="font-size: 0.85rem; letter-spacing: 0.5px;">Thiết lập chung cho tất cả biến thể</h6>
                            </div>
                            <div class="card-body p-4 pt-2">
                                <div class="row g-4">
                                    <div class="col-md-4">
                                        <label class="form-label fw-medium text-dark" style="font-size: 0.9rem;">Số lượng</label>
                                        <input type="text" class="form-control" id="globalSoLuong" placeholder="Ví dụ: 100" oninput="formatNumberInput(this)" style="border-radius: 6px; border-color: #d1d5db; padding: 10px 14px; text-align: left;">
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label fw-medium text-dark" style="font-size: 0.9rem;">Giá nhập</label>
                                        <div class="input-group">
                                            <input type="text" class="form-control" id="globalGiaNhap" placeholder="0" oninput="formatNumberInput(this)" style="border-radius: 6px 0 0 6px; border-color: #d1d5db; padding: 10px 14px; text-align: left;">
                                            <span class="input-group-text bg-white text-muted" style="border-radius: 0 6px 6px 0; border-color: #d1d5db;">VNĐ</span>
                                        </div>
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label fw-medium text-dark" style="font-size: 0.9rem;">Giá bán</label>
                                        <div class="input-group">
                                            <input type="text" class="form-control" id="globalGiaBan" placeholder="0" oninput="formatNumberInput(this)" style="border-radius: 6px 0 0 6px; border-color: #d1d5db; padding: 10px 14px; text-align: left;">
                                            <span class="input-group-text bg-white text-muted" style="border-radius: 0 6px 6px 0; border-color: #d1d5db;">VNĐ</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Cột phải (Phân loại & Thuộc tính) -->
                    <div class="col-lg-4 d-flex flex-column">
                        <div class="card bg-white border mb-4 flex-grow-1" style="border-radius: 8px; border-color: #e5e7eb !important;">
                            <div class="card-header bg-white border-bottom-0 pt-4 pb-2">
                                <h6 class="fw-bold mb-0 text-dark text-uppercase" style="font-size: 0.85rem; letter-spacing: 0.5px;">Phân loại</h6>
                            </div>
                            <div class="card-body p-4 pt-2">
                                <input type="hidden" name="trangThai" value="1">
                                <div class="mb-4">
                                    <label class="form-label fw-medium text-dark" style="font-size: 0.9rem;">Thương hiệu <span class="text-danger">*</span></label>
                                    <div class="input-group">
                                        <select class="form-select" id="thuongHieuSelect" name="thuongHieu.id" required style="border-radius: 6px 0 0 6px; border-color: #d1d5db; padding: 10px 14px;">
                                            <option value="">Chọn thương hiệu</option>
                                            <option th:each="th : ${listThuongHieu}" th:value="${th.id}" th:text="${th.tenThuongHieu}"></option>
                                        </select>
                                        <button class="btn btn-outline-secondary" type="button" onclick="promptAddNew('thuong-hieu', 'Thương Hiệu')" style="border-radius: 0 6px 6px 0; border-color: #d1d5db;"><i class="bi bi-plus-lg"></i></button>
                                    </div>
                                </div>
                                <div class="mb-4">
                                    <label class="form-label fw-medium text-dark" style="font-size: 0.9rem;">Danh mục <span class="text-danger">*</span></label>
                                    <div class="input-group">
                                        <select class="form-select" id="danhMucSelect" name="danhMuc.id" required style="border-radius: 6px 0 0 6px; border-color: #d1d5db; padding: 10px 14px;">
                                            <option value="">Chọn danh mục</option>
                                            <option th:each="dm : ${listDanhMuc}" th:value="${dm.id}" th:text="${dm.tenDanhMuc}"></option>
                                        </select>
                                        <button class="btn btn-outline-secondary" type="button" onclick="promptAddNew('danh-muc', 'Danh Mục')" style="border-radius: 0 6px 6px 0; border-color: #d1d5db;"><i class="bi bi-plus-lg"></i></button>
                                    </div>
                                </div>
                                <div class="mb-4">
                                    <label class="form-label fw-medium text-dark" style="font-size: 0.9rem;">Loại Giày <span class="text-danger">*</span></label>
                                    <div class="input-group">
                                        <select class="form-select" id="loaiGiaySelect" name="loaiGiay.id" required style="border-radius: 6px 0 0 6px; border-color: #d1d5db; padding: 10px 14px;">
                                            <option value="">Chọn loại giày</option>
                                            <option th:each="lg : ${listLoaiGiay}" th:value="${lg.id}" th:text="${lg.tenLoaiGiay}"></option>
                                        </select>
                                        <button class="btn btn-outline-secondary" type="button" onclick="promptAddNew('loai-giay', 'Loại Giày')" style="border-radius: 0 6px 6px 0; border-color: #d1d5db;"><i class="bi bi-plus-lg"></i></button>
                                    </div>
                                </div>
                                <div class="mb-2">
                                    <label class="form-label fw-medium text-dark" style="font-size: 0.9rem;">Chất liệu <span class="text-danger">*</span></label>
                                    <div class="input-group">
                                        <select class="form-select" id="chatLieuSelect" name="chatLieu.id" required style="border-radius: 6px 0 0 6px; border-color: #d1d5db; padding: 10px 14px;">
                                            <option value="">Chọn chất liệu</option>
                                            <option th:each="cl : ${listChatLieu}" th:value="${cl.id}" th:text="${cl.tenChatLieu}"></option>
                                        </select>
                                        <button class="btn btn-outline-secondary" type="button" onclick="promptAddNew('chat-lieu', 'Chất Liệu')" style="border-radius: 0 6px 6px 0; border-color: #d1d5db;"><i class="bi bi-plus-lg"></i></button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="text-end mt-2 mb-4">
                    <button type="button" class="btn text-white px-5 py-2 fw-bold" id="btnGenerateVariants" style="border-radius: 6px; font-size: 1rem; letter-spacing: 0.5px; background: linear-gradient(135deg, #0f2d4a 0%, #00adef 100%); border: none; box-shadow: 0 4px 12px rgba(0, 173, 239, 0.2); transition: all 0.2s ease-in-out;" onmouseover="this.style.background='#00adef'; this.style.boxShadow='0 6px 20px rgba(0, 173, 239, 0.35)'; this.style.transform='translateY(-1px)';" onmouseout="this.style.background='linear-gradient(135deg, #0f2d4a 0%, #00adef 100%)'; this.style.boxShadow='0 4px 12px rgba(0, 173, 239, 0.2)'; this.style.transform='translateY(0)';"><i class="bi bi-magic me-2"></i>Tạo biến thể</button>
                </div>

                <!-- PHẦN 2: BẢNG CHI TIẾT SẢN PHẨM -->
                <div class="card bg-white border mb-4" id="variantSection" style="border-radius: 8px; border-color: #e5e7eb !important;">
                    <div class="card-header bg-white border-bottom-0 pt-4 pb-2 d-flex justify-content-between align-items-center mb-0">
                        <h6 class="fw-bold mb-0 text-dark text-uppercase" style="font-size: 0.85rem; letter-spacing: 0.5px;">Danh sách biến thể</h6>
                    </div>
                    
                    <table class="table table-custom">
                        <thead>
                            <tr class="text-uppercase" style="font-size: 0.85rem; color: #475569;">
                                <th>STT</th>
                                <th style="text-align: left;">Tên Sản Phẩm</th>
                                <th>Số lượng</th>
                                <th>Giá Nhập</th>
                                <th>Giá Bán</th>
                                <th>Hành động</th>
                                <th>Upload Ảnh</th>
                            </tr>
                        </thead>
                        <tbody id="variantTableBody">
                            <tr><td colspan="7" style="height: 120px; border-bottom: none;"></td></tr>
                        </tbody>
                    </table>
                </div>

                <div class="text-end mt-3 mb-5">
                    <button type="submit" class="btn text-white px-5 py-2 fw-bold" style="border-radius: 6px; font-size: 1.1rem; letter-spacing: 0.5px; background: linear-gradient(135deg, #0f2d4a 0%, #00adef 100%); border: none; box-shadow: 0 4px 12px rgba(0, 173, 239, 0.2); transition: all 0.2s ease-in-out;" onmouseover="this.style.background='#00adef'; this.style.boxShadow='0 6px 20px rgba(0, 173, 239, 0.35)'; this.style.transform='translateY(-1px)';" onmouseout="this.style.background='linear-gradient(135deg, #0f2d4a 0%, #00adef 100%)'; this.style.boxShadow='0 4px 12px rgba(0, 173, 239, 0.2)'; this.style.transform='translateY(0)';"><i class="bi bi-floppy me-2"></i>Lưu Sản Phẩm</button>
                </div>

            </form>
        </main>
    </div>

    <!-- Modal Delete Size -->
    <div class="modal fade" id="deleteSizeModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">
          <div class="modal-header border-bottom-0 pb-0">
            <h5 class="modal-title fw-bold">Chi tiết biến thể</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body" id="deleteSizeModalBody">
            <!-- Dynamically populated -->
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <script th:inline="javascript">
        /*<![CDATA[*/
        var errorMessage = /*[[${errorMessage}]]*/ null;
        var successMessage = /*[[${successMessage}]]*/ null;
        /*]]>*/
    </script>
    <script>
        $(document).ready(function() {
            if (errorMessage) {
                Swal.fire({
                    toast: true,
                    position: 'top-end',
                    icon: 'error',
                    title: errorMessage,
                    showConfirmButton: false,
                    timer: 3000,
                    timerProgressBar: true
                });
            }
            if (successMessage) {
                Swal.fire({
                    toast: true,
                    position: 'top-end',
                    icon: 'success',
                    title: successMessage,
                    showConfirmButton: false,
                    timer: 3000,
                    timerProgressBar: true
                });
            }

            // Check tên sản phẩm real-time
            $('#tenSanPham').on('blur', function() {
                const name = $(this).val().trim();
                if (name.length > 0) {
                    $.get('/san-pham/api/check-name?name=' + encodeURIComponent(name), function(data) {
                        if (data.exists) {
                            $('#tenSanPham').css('border-color', '#ef4444');
                            $('#tenSanPhamError').show();
                        } else {
                            $('#tenSanPham').css('border-color', '#10b981');
                            $('#tenSanPhamError').hide();
                        }
                    });
                } else {
                    $('#tenSanPham').css('border-color', '#d1d5db');
                    $('#tenSanPhamError').hide();
                }
            });

            // Validate Giá nhập phải nhỏ hơn giá bán và check trùng tên
            document.getElementById('productForm').addEventListener('submit', function(e) {
                // Check name duplicate synchronously before submit
                const tenSanPham = document.getElementById('tenSanPham').value.trim();
                let nameExists = false;
                if (tenSanPham.length > 0) {
                    $.ajax({
                        url: '/san-pham/api/check-name?name=' + encodeURIComponent(tenSanPham),
                        type: 'GET',
                        async: false,
                        success: function(data) {
                            nameExists = data.exists;
                        }
                    });
                }
                
                if (nameExists) {
                    e.preventDefault();
                    Swal.fire({ toast: true, position: 'top-end', icon: 'error', title: 'Tên sản phẩm đã tồn tại!', showConfirmButton: false, timer: 3000 });
                    $('#tenSanPham').css('border-color', '#ef4444');
                    $('#tenSanPhamError').show();
                    $('#tenSanPham').focus();
                    return false;
                }

                const importPrices = document.getElementsByName('variantImportPrices');
                const prices = document.getElementsByName('variantPrices');
                
                if (importPrices.length === 0) {
                    e.preventDefault();
                    Swal.fire({ toast: true, position: 'top-end', icon: 'error', title: 'Vui lòng tạo ít nhất 1 biến thể!', showConfirmButton: false, timer: 3000 });
                    return false;
                }
                
                for (let i = 0; i < importPrices.length; i++) {
                    let giaNhap = parseFloat(importPrices[i].value) || 0;
                    let giaBan = parseFloat(prices[i].value) || 0;
                    if (giaNhap >= giaBan) {
                        e.preventDefault();
                        Swal.fire({
                            toast: true,
                            position: 'top-end',
                            icon: 'error',
                            title: 'Giá nhập phải nhỏ hơn giá bán ở tất cả các biến thể!',
                            showConfirmButton: false,
                            timer: 3000
                        });
                        return false;
                    }
                }
            });

        let colorImagesMap = {};

        function previewImages(input, colorId) {
            if (!colorImagesMap[colorId]) {
                colorImagesMap[colorId] = [];
            }
            
            if (input.files && input.files.length > 0) {
                let filesToProcess = Array.from(input.files);
                
                let spaceLeft = 6 - colorImagesMap[colorId].length;
                if (spaceLeft <= 0) {
                    Swal.fire({ toast: true, position: 'top-end', icon: 'warning', title: 'Đã đạt giới hạn 6 ảnh!', showConfirmButton: false, timer: 3000 });
                    input.value = '';
                    return;
                }
                
                if (filesToProcess.length > spaceLeft) {
                    Swal.fire({ toast: true, position: 'top-end', icon: 'warning', title: 'Chỉ có thể thêm ' + spaceLeft + ' ảnh nữa!', showConfirmButton: false, timer: 3000 });
                    filesToProcess = filesToProcess.slice(0, spaceLeft);
                }
                
                let loadedCount = 0;
                filesToProcess.forEach(file => {
                    var reader = new FileReader();
                    reader.onload = function(e) {
                        colorImagesMap[colorId].push(e.target.result);
                        loadedCount++;
                        if(loadedCount === filesToProcess.length) {
                            renderPreviewGrid(colorId);
                        }
                    }
                    reader.readAsDataURL(file);
                });
            }
            input.value = '';
        }

        function removeImage(colorId, index) {
            if (colorImagesMap[colorId]) {
                colorImagesMap[colorId].splice(index, 1);
                renderPreviewGrid(colorId);
            }
        }

            const grid = document.getElementById('previewGrid_' + colorId);

            images.forEach((b64, index) => {

            let valToSet = '';

                // Wrap in JSON array
                valToSet = JSON.stringify(images);
            }
            hiddenInputs.forEach(inp => inp.value = valToSet);
            
            // Hide/Show upload button
            const container = document.getElementById('imagePreviewContainer_' + colorId);

            if(images.length >= 6) {

                if (images.length > 0) {

                    uploadIcon.className = 'bi bi-cloud-arrow-up fs-3';
                    uploadText.className = 'mt-1 fw-medium';
                    uploadText.innerHTML = uploadText.dataset.originalText;
                }
            }
        }

        function formatNumberInput(input) {
            let cursor = input.selectionStart;
            let oldVal = input.value;
            
            // Get raw value (digits only)
            let rawValue = oldVal.replace(/[^0-9]/g, '');
            if (rawValue === '') rawValue = '0'; // Handle empty case by defaulting to 0
            
            // Calculate new formatted value
            let newVal = rawValue.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
            
            // Prevent leading zeros if not just '0'
            if (newVal.startsWith('0') && newVal.length > 1) {
                newVal = newVal.replace(/^0+/, '');
                if (newVal === '') newVal = '0';
                rawValue = newVal.replace(/,/g, '');
            }

            input.value = newVal;
            // Update hidden input (which is immediately next to it) if it is an input
            if (input.nextElementSibling && input.nextElementSibling.tagName === 'INPUT') {
                input.nextElementSibling.value = rawValue;
            }
            
            // Try to keep cursor in sensible position
            try {
                if (oldVal.length < newVal.length) {
                    cursor += (newVal.length - oldVal.length);
                } else if (oldVal.length > newVal.length) {
                    cursor -= (oldVal.length - newVal.length);
                }
                input.setSelectionRange(cursor, cursor);
            } catch (e) {
                // Ignore errors for cursor positioning (some browsers might throw on setSelectionRange for specific types)
            }
        }
        function removeColorGroup(colorId) {
            document.querySelectorAll(`.variant-row-${colorId}`).forEach(el => el.remove());
        }

        function formatNumberInputGroup(input, hiddenClass) {
            let cursor = input.selectionStart;
            let oldVal = input.value;
            let rawValue = oldVal.replace(/[^0-9]/g, '');
            if (rawValue === '') rawValue = '0';
            
            let newVal = rawValue.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
            if (newVal.startsWith('0') && newVal.length > 1) {
                newVal = newVal.replace(/^0+/, '');
                if (newVal === '') newVal = '0';
                rawValue = newVal.replace(/,/g, '');
            }

            input.value = newVal;
            
            document.querySelectorAll('.' + hiddenClass).forEach(hiddenInput => {
                hiddenInput.value = rawValue;
            });
            
            // Realtime Validation for Import vs Sell Price
            if (hiddenClass.startsWith('import-price-') || hiddenClass.startsWith('price-')) {
                let colorId = hiddenClass.replace('import-price-', '').replace('price-', '');
                let importInput = document.querySelector(`.input-import-${colorId}`);
                let priceInput = document.querySelector(`.input-price-${colorId}`);
                
                if (importInput && priceInput) {
                    let importVal = parseFloat(importInput.value.replace(/,/g, '')) || 0;
                    let priceVal = parseFloat(priceInput.value.replace(/,/g, '')) || 0;
                    
                    if (importVal >= priceVal && importVal > 0) {
                        importInput.classList.add('is-invalid');
                        priceInput.classList.add('is-invalid');
                    } else {
                        importInput.classList.remove('is-invalid');
                        priceInput.classList.remove('is-invalid');
                    }
                }
            }
            
            try {
                if (oldVal.length < newVal.length) cursor += (newVal.length - oldVal.length);
                else if (oldVal.length > newVal.length) cursor -= (oldVal.length - newVal.length);
                input.setSelectionRange(cursor, cursor);
            } catch (e) {}
        }

        function openDeleteSizeModal(colorId) {
            const row = document.querySelector(`.variant-row-${colorId}`);
            if (!row) return;
            const colorName = row.dataset.colorName;
            
            const modalBody = document.getElementById('deleteSizeModalBody');
            modalBody.innerHTML = `<p class="mb-3 text-muted">Chi tiết các biến thể của <strong>Màu ${colorName.toLowerCase()}</strong>:</p>`;
            
            const groups = row.querySelectorAll('.variant-hidden-group');
            if (groups.length === 0) return;
            
            let listHtml = `
            <div class="table-responsive mb-4" style="border: 1px solid #e2e8f0; border-radius: 8px; overflow: hidden;">
                <table class="table align-middle text-center mb-0" style="font-size: 0.95rem;">
                    <thead style="background-color: #f8fafc; color: #64748b; text-transform: uppercase; font-size: 0.8rem; letter-spacing: 0.5px;">
                        <tr>
                            <th class="py-3 border-0 fw-semibold">Kích cỡ</th>
                            <th class="py-3 border-0 fw-semibold">Số lượng</th>
                            <th class="py-3 border-0 fw-semibold">Giá nhập</th>
                            <th class="py-3 border-0 fw-semibold">Giá bán</th>
                            <th class="py-3 border-0 fw-semibold">Hành động</th>
                        </tr>
                    </thead>
                    <tbody style="border-top: 1px solid #e2e8f0;">
            `;
            
            groups.forEach(g => {
                let sId = g.dataset.sizeId;
                let sName = g.dataset.sizeName;
                
                let qty = g.querySelector('input[name="variantQuantities"]').value;
                let importPrice = g.querySelector('input[name="variantImportPrices"]').value;
                let price = g.querySelector('input[name="variantPrices"]').value;
                
                let dispQty = qty.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
                let dispImportPrice = importPrice.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
                let dispPrice = price.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
                
                listHtml += `
                        <tr style="border-bottom: 1px solid #f1f5f9;">
                            <td class="fw-bold text-dark py-3">${sName}</td>
                            <td class="text-dark py-3">${dispQty}</td>
                            <td class="text-dark py-3">${dispImportPrice} đ</td>
                            <td class="text-dark py-3">${dispPrice} đ</td>
                            <td class="py-3">
                                <button type="button" class="btn btn-sm btn-outline-dark rounded-circle shadow-none" style="width: 34px; height: 34px; padding: 0; display: inline-flex; align-items: center; justify-content: center; transition: all 0.2s;" onmouseover="this.style.backgroundColor='#1e293b'; this.style.color='#fff';" onmouseout="this.style.backgroundColor='transparent'; this.style.color='#1e293b';" onclick="removeSpecificSize('${colorId}', '${sId}')"><i class="bi bi-trash3"></i></button>
                            </td>
                        </tr>
                `;
            });
            
            listHtml += `
                    </tbody>
                </table>
            </div>
            `;
            
            listHtml += `<button type="button" class="btn text-white w-100 py-3 fw-bold" style="background-color: #334155; border: none; border-radius: 8px; font-size: 1rem; transition: all 0.2s; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);" onmouseover="this.style.backgroundColor='#475569'; this.style.transform='translateY(-2px)'; this.style.boxShadow='0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05)';" onmouseout="this.style.backgroundColor='#334155'; this.style.transform='translateY(0)'; this.style.boxShadow='0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06)';" onclick="removeColorGroup('${colorId}')"><i class="bi bi-trash3-fill me-2 fs-5" style="vertical-align: middle;"></i><span style="vertical-align: middle;">Xóa Toàn Bộ Màu Này</span></button>`;
            
            modalBody.innerHTML += listHtml;
            
            const myModal = new bootstrap.Modal(document.getElementById('deleteSizeModal'));
            myModal.show();
        }

        function removeSpecificSize(colorId, sizeId) {
            Swal.fire({
                title: 'Xác nhận xóa?',
                text: "Bạn có chắc chắn muốn xóa kích cỡ này khỏi màu hiện tại?",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#00adef',
                cancelButtonColor: '#6c757d',
                confirmButtonText: 'Đồng ý',
                cancelButtonText: 'Hủy'
            }).then((result) => {
                if (result.isConfirmed) {
                    const group = document.querySelector(`.variant-hidden-group.color-${colorId}-size-${sizeId}`);
                    if (group) group.remove();
                    
                    const remaining = document.querySelectorAll(`.variant-hidden-group[data-color-id="${colorId}"]`);
                    const modalEl = document.getElementById('deleteSizeModal');
                    let modalObj = bootstrap.Modal.getInstance(modalEl);
                    if (!modalObj) {
                        modalObj = new bootstrap.Modal(modalEl);
                    }
                    
                    if (remaining.length === 0) {
                        const row = document.querySelector(`.variant-row-${colorId}`);
                        if (row) row.remove();
                        if (modalObj) modalObj.hide();
                    } else {
                        let names = Array.from(remaining).map(g => g.dataset.sizeName).join(', ');
                        let labelEl = document.getElementById(`size-names-${colorId}`);
                        if (labelEl) labelEl.innerText = 'Kích cỡ: ' + names;
                        
                        openDeleteSizeModal(colorId); // refresh modal content
                    }
                }
            });
        }
        
        // Override the simple one with one that hides modal
        window.removeColorGroup = function(colorId) {
            Swal.fire({
                title: 'Xác nhận xóa toàn bộ?',
                text: "Tất cả các kích cỡ của màu này sẽ bị xóa. Bạn chắc chứ?",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#00adef',
                cancelButtonColor: '#6c757d',
                confirmButtonText: 'Xóa toàn bộ',
                cancelButtonText: 'Hủy'
            }).then((result) => {
                if (result.isConfirmed) {
                    document.querySelectorAll(`.variant-row-${colorId}`).forEach(el => el.remove());
                    const modalEl = document.getElementById('deleteSizeModal');
                    const modalObj = bootstrap.Modal.getInstance(modalEl);
                    if (modalObj) modalObj.hide();
                }
            });
        };
    </script>
</body>
</html>
