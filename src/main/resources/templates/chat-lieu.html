<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Chất Liệu | VShoes</title>
    <!-- Force sync chat-lieu -->
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/sidebar.css?v=99">
    <link rel="stylesheet" href="/css/khach-hang.css?v=99">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <div th:replace="~{sidebar/sidebar :: sidebar}"></div>

        <!-- Nội dung chính -->
        <main class="main-content">
            <div class="screen-header" style="margin-bottom: 24px;">
                <h1 style="font-size: 24px; font-weight: 700; color: #0f172a; margin: 0;">Quản lý thuộc tính</h1>
                <p style="font-size: 14px; color: #64748b; margin: 4px 0 0 0;">Quản lý danh sách các thuộc tính của sản phẩm</p>
            </div>

            <!-- Card Bộ Lọc -->
            <div class="filter-section-card mb-4" style="background: #fff; border-radius: 12px; border: 1px solid #e2e8f0; padding: 20px;">
                <div class="filter-header d-flex justify-content-between align-items-center mb-3" style="border: none;">
                    <span class="filter-section-title mb-0" style="font-weight: 600; color: #1e293b; display: flex; align-items: center; gap: 8px;">
                        <i data-lucide="list-filter" style="width: 20px; height: 20px;"></i> Bộ lọc thuộc tính
                    </span>
                </div>
                
                <form action="/chat-lieu" method="GET">
                    <div class="filter-grid" style="display: flex; gap: 24px; align-items: flex-end;">
                        <div class="fi-col" style="flex: 1;">
                            <label class="fi-label" for="keyword" style="font-size: 13px; color: #64748b; font-weight: 500; margin-bottom: 8px;">Tìm kiếm nhanh</label>
                            <div class="fi-search-wrap" style="position: relative;">
                                <i class="bi bi-search fi-search-icon" style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #94a3b8;"></i>
                                <input type="text" name="keyword" id="keyword" class="fi-input form-control" placeholder="Tên, mã..." th:value="${keyword}" style="padding-left: 36px; border-radius: 8px; border: 1px solid #e2e8f0; height: 42px;">
                            </div>
                        </div>
                        <div class="fi-col" style="flex: 1;">
                            <label class="fi-label" for="trangThai" style="font-size: 13px; color: #64748b; font-weight: 500; margin-bottom: 8px;">Trạng thái</label>
                            <select name="trangThai" id="trangThai" class="fi-input form-select" style="border-radius: 8px; border: 1px solid #e2e8f0; height: 42px; color: #475569;" onchange="this.form.submit()">
                                <option value="">Tất cả</option>
                                <option value="true" th:selected="${trangThai == true}">Đang hoạt động</option>
                                <option value="false" th:selected="${trangThai == false}">Ngừng hoạt động</option>
                            </select>
                        </div>
                        <div class="fi-col" style="width: 42px;">
                            <a href="/chat-lieu" class="btn btn-light" title="Làm mới bộ lọc" style="width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; border-radius: 8px; border: 1px solid #e2e8f0; background: #f8fafc;">
                                <i data-lucide="rotate-cw" style="width: 18px; height: 18px; color: #64748b;"></i>
                            </a>
                        </div>
                        <div style="display: none;">
                            <button type="submit" id="submitFilterBtn">Tìm kiếm</button>
                        </div>
                    </div>
                </form>
            </div>

            <!-- Card Danh Sách -->
            <div class="customer-card" style="background: #fff; border-radius: 12px; border: 1px solid #e2e8f0; padding: 0;">
                <div style="display: flex; justify-content: space-between; align-items: center; padding: 20px 20px 10px 20px;">
                    <span class="card-title-table" style="font-weight: 600; color: #1e293b; font-size: 16px; margin-bottom: 0; display: flex; align-items: center; gap: 8px;">
                        <i data-lucide="layout-grid" style="width: 20px; height: 20px;"></i> Danh sách Chất liệu
                    </span>
                    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addModal" style="background: #4f46e5; border: none; border-radius: 8px; padding: 8px 16px; display: flex; align-items: center; gap: 8px; font-weight: 500;">
                        <i data-lucide="plus" style="width: 18px; height: 18px;"></i> Tạo mới
                    </button>
                </div>

                <!-- TABS inside the list card -->
                <div th:replace="~{sidebar/thuoc-tinh-tabs :: tabs(activeTab='chat-lieu')}"></div>

                <div class="custom-table-container" style="padding: 0 20px 20px 20px;">
                    <table class="customer-table">
                        <thead>
                            <tr style="border-bottom: 1px solid #e2e8f0; background: transparent;">
                                <th style="width: 60px; color: #64748b; font-weight: 600; padding: 12px 16px;">STT</th>
                                <th style="color: #64748b; font-weight: 600; padding: 12px 16px;">Mã chất liệu</th>
                                <th style="color: #64748b; font-weight: 600; padding: 12px 16px;">Tên chất liệu</th>
                                <th style="color: #64748b; font-weight: 600; padding: 12px 16px;">Trạng thái</th>
                                <th style="width: 120px; text-align: center; color: #64748b; font-weight: 600; padding: 12px 16px;">Hành động</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Lặp qua danh sách chất liệu -->
                            <tr th:each="item, stat : ${pageData.content}" style="border-bottom: 1px solid #f1f5f9;">
                                <td style="text-align: center; padding: 16px; color: #64748b;" th:text="${(pageData.number * pageData.size) + stat.index + 1}">1</td>
                                <td th:text="${item.maChatLieu}" style="padding: 16px; color: #64748b;">CL01</td>
                                <td th:text="${item.tenChatLieu}" style="padding: 16px; color: #64748b;">Da bò</td>
                                <td style="padding: 16px;">
                                    <span th:if="${item.trangThai}" class="px-3 py-1 fw-medium" style="background-color: #dcfce7; color: #16a34a; border-radius: 20px; font-size: 0.85rem; display: inline-block;">Đang hoạt động</span>
                                    <span th:unless="${item.trangThai}" class="px-3 py-1 fw-medium" style="background-color: #fce8e6; color: #d93025; border-radius: 20px; font-size: 0.85rem; display: inline-block;">Ngừng hoạt động</span>
                                </td>
                                <td style="text-align: center; padding: 16px;">
                                    <div class="action-buttons" style="display: flex; align-items: center; justify-content: center; gap: 20px;">
                                        <button class="btn-icon" title="Chỉnh sửa" data-bs-toggle="modal" th:data-bs-target="'#editModal' + ${item.id}" style="border: none; background: none; padding: 0;">
                                            <i data-lucide="pencil" style="width: 20px; height: 20px; color: #64748b;"></i>
                                        </button>
                                        <button type="button" title="Đổi trạng thái" th:onclick="'confirmToggleStatus(\'/chat-lieu/delete/' + ${item.id} + '\')'" style="width: 38px; height: 38px; border-radius: 50%; border: 1px solid #e2e8f0; background: #ffffff; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s;" onmouseover="this.style.backgroundColor='#f1f5f9'" onmouseout="this.style.backgroundColor='#ffffff'">
                                            <i data-lucide="refresh-cw" style="width: 18px; height: 18px; color: #3b82f6;"></i>
                                        </button>
                                    </div>
                                </td>
                            </tr>
                            
                            <tr th:if="${#lists.isEmpty(pageData.content)}">
                                <td colspan="5" class="text-center text-muted py-4">Không tìm thấy dữ liệu</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Thanh phân trang -->
                <div th:replace="~{sidebar/thuoc-tinh-tabs :: pagination(pageData=${pageData}, baseUrl='/chat-lieu', keyword=${keyword}, trangThai=${trangThai})}"></div>
            </div>

        </main>
    </div>

    <!-- Modals Chỉnh Sửa (Đặt ngoài table để tránh lỗi z-index/màn đen) -->
    <th:block th:each="item : ${pageData.content}">
        <div class="modal fade" th:id="'editModal' + ${item.id}" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content text-start">
                    <form th:action="@{'/chat-lieu/update/' + ${item.id}}" method="POST">
                        <div class="modal-header">
                            <h5 class="modal-title fw-bold">Chỉnh Sửa Chất Liệu</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body">
                            <div class="mb-3">
                                <label class="form-label fw-medium">Mã Chất Liệu</label>
                                <input type="text" class="form-control bg-light" name="maChatLieu" th:value="${item.maChatLieu}" readonly required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-medium">Tên Chất Liệu</label>
                                <input type="text" class="form-control" name="tenChatLieu" th:value="${item.tenChatLieu}" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-medium">Trạng Thái</label>
                                <select class="form-select" name="trangThai">
                                    <option value="true" th:selected="${item.trangThai == true}">Đang sử dụng</option>
                                    <option value="false" th:selected="${item.trangThai == false}">Ngừng sử dụng</option>
                                </select>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                            <button type="submit" class="btn btn-primary">Lưu thay đổi</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </th:block>

    <!-- Modal Thêm Mới -->
    <div class="modal fade" id="addModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <form action="/chat-lieu/add" method="POST">
                    <div class="modal-header">
                        <h5 class="modal-title fw-bold">Thêm Chất Liệu Mới</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label fw-medium">Tên Chất Liệu</label>
                            <input type="text" class="form-control" name="tenChatLieu" placeholder="Nhập tên chất liệu" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-medium">Trạng Thái</label>
                            <select class="form-select bg-light" disabled>
                                <option value="true" selected>Đang sử dụng</option>
                            </select>
                            <input type="hidden" name="trangThai" value="true">
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                        <button type="submit" class="btn btn-primary">Thêm mới</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- SweetAlert2 JS -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <script th:inline="javascript">
        /*<![CDATA[*/
        var successMsg = /*[[${successMessage}]]*/ null;
        var errorMsg = /*[[${errorMessage}]]*/ null;
        /*]]>*/
        
        document.addEventListener("DOMContentLoaded", function() {
            if (successMsg) {
                Swal.fire({
                    toast: true,
                    position: 'top-end',
                    icon: 'success',
                    title: successMsg,
                    showConfirmButton: false,
                    timer: 3000,
                    timerProgressBar: true
                });
            }
            if (errorMsg) {
                Swal.fire({
                    toast: true,
                    position: 'top-end',
                    icon: 'error',
                    title: errorMsg,
                    showConfirmButton: false,
                    timer: 3000,
                    timerProgressBar: true
                });
            }

            document.querySelectorAll("form").forEach(form => {
                form.addEventListener("submit", function(e) {
                    const input = form.querySelector("input[name='tenChatLieu']");
                    if (input) {
                        const val = input.value.trim();
                        if (val === '') {
                            e.preventDefault();
                            Swal.fire({
                                icon: 'error',
                                title: 'Lỗi nhập liệu',
                                text: 'Tên chất liệu không được để trống!'
                            });
                        }
                    }
                });
            });
        });
        function confirmToggleStatus(url) {
            Swal.fire({
                title: 'Xác nhận thay đổi',
                text: 'Bạn có chắc chắn muốn thay đổi trạng thái?',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#3b82f6',
                cancelButtonColor: '#94a3b8',
                confirmButtonText: 'Đồng ý',
                cancelButtonText: 'Hủy'
            }).then((result) => {
                if (result.isConfirmed) {
                    window.location.href = url;
                }
            });
        }
    </script>
</body>
</html>
