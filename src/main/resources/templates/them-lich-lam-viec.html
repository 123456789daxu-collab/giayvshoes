<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thêm Lịch Làm Việc | VShoes</title>

    <link rel="stylesheet" href="/css/sidebar.css?v=99">
    <link rel="stylesheet" href="/css/store.css?v=99">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #f4f6f8;
            margin: 0;
        }

        .main-content {
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .page-header {
            width: 100%;
            max-width: 600px;
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 24px;
        }

        .page-title {
            margin: 0;
            font-size: 24px;
            color: #1e293b;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-container {
            width: 100%;
            max-width: 600px;
        }

        .form-group {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-size: 14px;
            font-weight: 600;
            color: #475569;
        }

        .form-group label span {
            color: #ef4444;
        }

        .custom-select,
        .custom-textarea {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            font-size: 14px;
            outline: none;
            color: #1e293b;
            background: #f8fafc;
            transition: all 0.25s ease;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        .custom-select:focus,
        .custom-textarea:focus {
            background: #ffffff;
            border-color: #6366f1;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
        }

        .action-row {
            display: flex;
            justify-content: flex-end;
            gap: 20px;
            margin-top: 30px;
        }
    </style>
</head>

<body>
    <div class="app-container">
        <div th:replace="~{sidebar/sidebar :: sidebar}"></div>

        <main class="main-content">

            <div class="page-header">
                <a href="/lich-lam-viec"
                    style="color: #64748b; text-decoration: none; display: flex; align-items: center;">
                    <i data-lucide="arrow-left" style="width: 20px; height: 20px;"></i>
                </a>
                <h1 class="page-title">
                    <i data-lucide="calendar-plus" style="color: #4f46e5; width: 24px; height: 24px;"></i>
                    Thêm Mới Lịch Làm Việc
                </h1>
            </div>

            <div class="form-container glass-card">
                <form id="formLichLamViec">
                    <div class="form-group">
                        <label>Nhân viên <span>*</span></label>
                        <select id="selectNhanVien" class="custom-select" required>
                            <option value="">-- Chọn nhân viên --</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Ca làm <span>*</span></label>
                        <select id="selectCaLam" class="custom-select" required>
                            <option value="">-- Chọn ca làm --</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Ngày làm việc <span>*</span></label>
                        <input type="date" id="inputNgayLamViec" class="glass-input"
                            style="width: 100%; box-sizing: border-box;" required>
                    </div>

                    <div class="form-group">
                        <label>Ghi chú</label>
                        <textarea id="inputGhiChu" class="custom-textarea" rows="3"
                            placeholder="Nhập ghi chú (nếu có)..."></textarea>
                    </div>

                    <div class="action-row">
                        <a href="/lich-lam-viec" style="text-decoration: none;">
                            <button type="button" class="btn-premium-secondary hover-lift">Hủy</button>
                        </a>
                        <button type="submit" class="btn-premium hover-lift">
                            <i data-lucide="save" style="width: 20px; height: 20px;"></i> Lưu Lịch
                        </button>
                    </div>
                </form>
            </div>

        </main>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            lucide.createIcons();

            // Lấy tham số ngày từ URL (nếu có)
            const urlParams = new URLSearchParams(window.location.search);
            const ngayParam = urlParams.get('ngay');
            if (ngayParam) {
                document.getElementById('inputNgayLamViec').value = ngayParam;
            }

            // Fetch Dropdown Data
            fetch('/api/nhan-vien')
                .then(res => res.json())
                .then(data => {
                    const select = document.getElementById('selectNhanVien');
                    data.forEach(nv => {
                        select.innerHTML += `<option value="${nv.id}">${nv.maNhanVien} - ${nv.hoTen}</option>`;
                    });
                });

            fetch('/api/ca-lam')
                .then(res => res.json())
                .then(data => {
                    const select = document.getElementById('selectCaLam');
                    data.forEach(ca => {
                        if (ca.trangThai === 1) {
                            select.innerHTML += `<option value="${ca.id}">${ca.tenCa} (${ca.thoiGianBatDau.substring(0, 5)} - ${ca.thoiGianKetThuc.substring(0, 5)})</option>`;
                        }
                    });
                });

            // Handle Form Submit
            document.getElementById('formLichLamViec').addEventListener('submit', function (e) {
                e.preventDefault();
                const payload = {
                    nhanVien: { id: document.getElementById('selectNhanVien').value },
                    caLam: { id: document.getElementById('selectCaLam').value },
                    ngayLamViec: document.getElementById('inputNgayLamViec').value,
                    ghiChu: document.getElementById('inputGhiChu').value
                };

                fetch('/api/lich-lam-viec', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                })
                    .then(res => {
                        if (res.ok) return res.json();
                        throw new Error('Lỗi server');
                    })
                    .then(data => {
                        Swal.fire({
                            icon: 'success',
                            title: 'Thành công!',
                            text: 'Đã thêm lịch làm việc.',
                            showConfirmButton: false,
                            timer: 1500
                        }).then(() => {
                            window.location.href = '/lich-lam-viec'; // Trở về trang quản lý lịch
                        });
                    })
                    .catch(err => {
                        Swal.fire('Lỗi', 'Không thể lưu lịch làm việc', 'error');
                    });
            });
        });
    </script>
</body>

</html>
