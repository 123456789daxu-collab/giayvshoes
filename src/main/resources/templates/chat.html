<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hỗ trợ khách hàng trực tuyến | VShoes</title>
    <!-- Nhúng CSS sidebar, header & layout dùng chung -->
    <link rel="stylesheet" href="/css/global-typography.css?v=1.0">
    <link rel="stylesheet" href="/css/sidebar.css?v=99">
    <link rel="stylesheet" href="/css/header.css?v=99">
    <!-- Nhúng CSS riêng của trang Chat -->
    <link rel="stylesheet" href="/css/chat.css?v=2.0">
    <!-- SweetAlert2 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>
    <div class="app-container">
        <!-- Nhúng Sidebar dùng chung -->
        <div th:replace="~{sidebar/sidebar :: sidebar}"></div>

        <!-- NỘI DUNG CHÍNH -->
        <main class="main-content">
            <!-- Nhúng Header dùng chung -->
            <div th:replace="~{header/header :: header}"></div>

            <div class="chat-app-container">
                <!-- Tiêu đề trang như mẫu -->
                <div class="chat-page-header">
                    <h2 class="chat-page-title" style="font-size: 20px; font-weight: 700; color: #1e293b; margin: 0;">Hỗ trợ khách hàng trực tuyến</h2>
                </div>

                <!-- Bàn làm việc Chat 2 cột -->
                <div class="chat-workspace-card">
                    <!-- CỘT TRÁI: DANH SÁCH KHÁCH HÀNG -->
                    <div class="chat-left-panel">
                        <!-- Ô tìm kiếm -->
                        <div class="chat-search-box-wrap">
                            <i data-lucide="search" class="chat-search-ico" style="width: 20px; height: 20px;"></i>
                            <input type="text" id="chatSearchInput" class="chat-search-input" 
                                   placeholder="Tìm khách hàng, SĐT..."
                                   oninput="onSearchInput(this.value)">
                        </div>

                        <!-- Tabs: Đang hoạt động & Lịch sử chat -->
                        <div class="chat-tabs-bar">
                            <button class="chat-tab-btn active" id="tabActiveBtn" onclick="switchTab('active')">Đang hoạt động</button>
                            <button class="chat-tab-btn" id="tabHistoryBtn" onclick="switchTab('history')">Lịch sử chat</button>
                        </div>

                        <!-- Danh sách hội thoại -->
                        <div class="chat-sessions-list" id="chatSessionsList">
                            <!-- Dynamic render via JS -->
                        </div>
                    </div>

                    <!-- CỘT PHẢI: KHUNG CHAT CHI TIẾT -->
                    <div class="chat-right-panel" id="chatRightPanel">
                        <!-- Trạng thái chưa chọn khách -->
                        <div class="chat-empty-center" id="chatEmptyPlaceholder" style="height: 100%;">
                            <div style="margin-bottom: 12px;"><i data-lucide="message-square" style="width: 52px; height: 52px; color: #00adef;"></i></div>
                            <div style="font-size: 16.5px; font-weight: 800; color: #334155; margin-bottom: 4px;">Chọn một khách hàng để hỗ trợ</div>
                            <div style="font-size: 13.5px; color: #94a3b8; max-width: 320px;">Trực tiếp giải đáp thắc mắc, tư vấn chọn size giày và chăm sóc khách hàng theo thời gian thực.</div>
                        </div>

                        <!-- Khung chi tiết chat (khi đã chọn 1 phiên) -->
                        <div id="chatDetailContainer" style="display: none; height: 100%; flex-direction: column;">
                            <!-- Header khách hàng -->
                            <div class="chat-detail-header">
                                <div class="chat-detail-user-wrap">
                                    <div class="chat-detail-avatar-cyan">
                                        <i data-lucide="user" style="width: 20px; height: 20px;"></i>
                                    </div>
                                    <div class="chat-detail-meta">
                                        <div class="chat-detail-title" id="activeCustomerName">Trần Vũ Tùng Anh</div>
                                        <div class="chat-detail-sub">
                                            <span id="activeCustomerPhone"><i data-lucide="phone" style="width: 13px; height: 13px; vertical-align: -2px; margin-right: 4px;"></i> 0383854485</span>
                                            <span>•</span>
                                            <span id="activeStartTime"><i data-lucide="clock" style="width: 13px; height: 13px; vertical-align: -2px; margin-right: 4px;"></i> Bắt đầu lúc: 22:27 - 6/7/2026</span>
                                        </div>
                                    </div>
                                </div>

                                <div>
                                    <button class="chat-btn-close-session" onclick="closeCurrentSession()">
                                        <i data-lucide="x-circle" style="width: 20px; height: 20px;"></i>
                                        <span>Đóng phiên chat</span>
                                    </button>
                                </div>
                            </div>

                            <!-- Dòng chảy tin nhắn (Stream) -->
                            <div class="chat-stream-body" id="chatStreamBody">
                                <!-- Messages rendered dynamically -->
                            </div>

                            <!-- Khung nhập tin nhắn & nút Gửi -->
                            <div class="chat-footer-composer" id="chatComposerWrap">
                                <textarea id="adminChatInput" class="chat-composer-textarea" 
                                          placeholder="Nhập tin nhắn phản hồi cho khách hàng..." 
                                          rows="1"></textarea>
                                <button class="chat-btn-send" onclick="sendAdminMessage()">
                                    <i data-lucide="send" style="width: 15px; height: 15px;"></i>
                                    <span>Gửi</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- SockJS & STOMP CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <script th:src="@{/js/chat.js}"></script>
</body>
</html>
