<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý đánh giá | VShoes</title>
    <!-- Nhúng CSS sidebar, header & layout dùng chung -->
    <link rel="stylesheet" href="/css/global-typography.css?v=1.0">
    <link rel="stylesheet" href="/css/sidebar.css?v=99">
    <link rel="stylesheet" href="/css/header.css?v=99">
    <!-- Nhúng CSS riêng của trang quản lý đánh giá -->
    <link rel="stylesheet" href="/css/danh-gia.css?v=4.0">
    <!-- SweetAlert2 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>
    <div class="app-container">
        <!-- Nhúng Sidebar dùng chung -->
        <div th:replace="~{sidebar/sidebar :: sidebar}"></div>

        <!-- NỘI DUNG CHÍNH -->
        <main class="main-content">
            <!-- Nhúng Header dùng chung -->
            <div th:replace="~{header/header :: header}"></div>

            <div class="dg-container">
                <!-- 1. VIEW 1: DANH SÁCH BẢNG (MAIN TABLE VIEW) -->
                <div id="dgListView">
                    <!-- HEADER SECTION: Tiêu đề + Toolbar tìm kiếm -->
                    <div class="dg-header-wrap">
                        <div class="dg-header-left">
                            <h2 class="dg-page-title">Quản lý đánh giá</h2>
                            <p class="dg-page-subtitle">Xem và quản lý đánh giá của khách hàng theo từng sản phẩm.</p>
                        </div>

                        <div class="dg-header-toolbar">
                            <!-- Dropdown Chế độ xem -->
                            <div class="dg-select-mode-wrap">
                                <select id="viewModeSelect" class="dg-select-mode" onchange="onViewModeChange(this.value)">
                                    <option value="by-product" selected>Xem theo sản phẩm</option>
                                    <option value="all-reviews">Xem tất cả đánh giá</option>
                                </select>
                            </div>

                            <!-- Ô tìm kiếm có icon -->
                            <div class="dg-search-wrap" id="headerSearchWrap">
                                <span class="dg-search-icon">
                                    <i data-lucide="search" style="width: 15px; height: 15px;"></i>
                                </span>
                                <input type="text" id="filterSearch" class="dg-search-input"
                                       placeholder="Tìm theo tên hoặc mã sản phẩm..."
                                       oninput="onSearchInput(this.value)">
                            </div>
                        </div>
                    </div>

                    <!-- TABLE CARD -->
                    <div class="dg-main-card">
                        <div class="dg-table-responsive">
                            <table class="dg-table">
                                <thead id="dgTableHead">
                                    <!-- Dynamic Render via JS -->
                                </thead>
                                <tbody id="reviewTableBody">
                                    <!-- Dynamic Render via JS -->
                                </tbody>
                            </table>
                        </div>

                        <!-- Phân trang -->
                        <div class="dg-pagination-wrap" id="paginationWrap" style="display: none;">
                            <!-- Dynamic pagination rendered via JS -->
                        </div>
                    </div>
                </div>

                <!-- 2. VIEW 2: CHI TIẾT ĐÁNH GIÁ CỦA SẢN PHẨM (DETAIL VIEW NHƯ ẢNH) -->
                <div id="dgDetailView" style="display: none;">
                    <!-- Nút Quay lại danh sách -->
                    <div class="dg-back-btn-wrap">
                        <button class="dg-back-btn" onclick="backToList()">
                            <i data-lucide="arrow-left" style="width: 20px; height: 20px;"></i>
                            <span>Quay lại danh sách</span>
                        </button>
                    </div>

                    <!-- Card 1: Banner Thông tin sản phẩm -->
                    <div class="dg-detail-card" id="detailProductBanner">
                        <!-- Render qua JS -->
                    </div>

                    <!-- Card 2: Điểm TB & Các nút lọc sao dạng Pill -->
                    <div class="dg-detail-card" id="detailRatingPillCard">
                        <!-- Render qua JS -->
                    </div>

                    <!-- Card 3: Bộ lọc Ngày + Trạng thái + Nút Phân tích AI -->
                    <div class="dg-detail-card dg-filter-action-card">
                        <div class="dg-filter-inputs-group">
                            <div class="dg-filter-input-wrap">
                                <label class="dg-filter-label" for="detailDateFrom">Từ ngày</label>
                                <input type="date" id="detailDateFrom" class="dg-date-input" onchange="onDetailFilterChange()">
                            </div>
                            <div class="dg-filter-input-wrap">
                                <label class="dg-filter-label" for="detailDateTo">Đến ngày</label>
                                <input type="date" id="detailDateTo" class="dg-date-input" onchange="onDetailFilterChange()">
                            </div>
                            <div class="dg-filter-input-wrap">
                                <label class="dg-filter-label" for="detailStatusFilter">Trạng thái</label>
                                <select id="detailStatusFilter" class="dg-select-input" onchange="onDetailFilterChange()">
                                    <option value="all">Tất cả trạng thái</option>
                                    <option value="1" selected>Đang hiển thị</option>
                                    <option value="0">Đã ẩn</option>
                                </select>
                            </div>
                        </div>

                        <div>
                            <button class="dg-btn-analyze" onclick="analyzeCurrentProduct()">
                                <i data-lucide="sparkles" style="width: 15px; height: 15px;"></i>
                                <span>Phân tích</span>
                            </button>
                        </div>
                    </div>

                    <!-- Card 4+: Danh sách từng thẻ đánh giá của khách hàng -->
                    <div id="detailReviewsList" class="dg-detail-reviews-list">
                        <!-- Render qua JS -->
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Lightbox Modal for Fullsize Image View -->
    <div id="dgLightboxModal" class="dg-lightbox-overlay" onclick="closeLightbox(event)" style="display: none;">
        <div class="dg-lightbox-content">
            <img id="dgLightboxImg" src="" alt="Ảnh phóng to">
            <button class="dg-lightbox-close" onclick="closeLightbox()">&times;</button>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="/js/danh-gia.js?v=4.0"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (window.lucide && lucide.createIcons) lucide.createIcons();
        });
    </script>
</body>

</html>
