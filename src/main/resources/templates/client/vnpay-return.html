<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kết quả thanh toán VNPay | VSHOES</title>
    <link rel="icon" type="image/png" href="/images/logo.png">
    <link rel="stylesheet" href="/css/global-typography.css?v=1.0">
    <link rel="stylesheet" href="/css/trang-chu.css?v=99">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { background: #f4f6f9; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .result-card { background: #fff; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,.08); padding: 48px 40px; max-width: 480px; width: 100%; text-align: center; }
        .icon-circle { width: 80px; height: 80px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 24px; }
        .icon-circle.success { background: #ecfdf5; }
        .icon-circle.fail    { background: #fef2f2; }
        h2 { font-size: 22px; font-weight: 800; margin: 0 0 8px; }
        .subtitle { color: #64748b; font-size: 14px; margin-bottom: 28px; }
        .info-row { display: flex; justify-content: space-between; font-size: 14px; padding: 10px 0; border-bottom: 1px solid #f1f5f9; }
        .info-row:last-of-type { border-bottom: none; }
        .info-label { color: #64748b; }
        .info-value { font-weight: 700; color: #0f172a; }
        .btn-home { display: inline-block; margin-top: 28px; padding: 14px 32px; background: linear-gradient(135deg,#00adef,#0080ff); color: #fff; border-radius: 10px; font-weight: 800; font-size: 15px; text-decoration: none; }
        .spinner { width: 40px; height: 40px; border: 4px solid #e2e8f0; border-top-color: #0080ff; border-radius: 50%; animation: spin .8s linear infinite; margin: 24px auto; }
        @keyframes spin { to { transform: rotate(360deg); } }
        #loadingState { display: block; }
        #resultState  { display: none; }
    </style>
</head>
<body>
<div class="result-card">
    <!-- Loading state -->
    <div id="loadingState">
        <div class="spinner"></div>
        <p style="color:#64748b;font-size:14px;">Đang xác nhận kết quả thanh toán...</p>
    </div>

    <!-- Result state -->
    <div id="resultState">
        <div class="icon-circle" id="iconCircle"></div>
        <h2 id="titleText"></h2>
        <p class="subtitle" id="subtitleText"></p>

        <div id="infoRows"></div>

        <a href="/trang-chu" class="btn-home">Về Trang Chủ</a>
    </div>
</div>

<script>
(async function () {
    const params = new URLSearchParams(window.location.search);

    const responseCode = params.get('vnp_ResponseCode') || '';
    const txnRef       = params.get('vnp_TxnRef') || '';
    const transNo      = params.get('vnp_TransactionNo') || '';
    const amountRaw    = params.get('vnp_Amount') || '0';
    const bankCode     = params.get('vnp_BankCode') || '';
    const payDate      = params.get('vnp_PayDate') || '';
    const secureHash   = params.get('vnp_SecureHash') || '';

    const amount = parseInt(amountRaw) / 100;
    const fmtAmount = amount.toLocaleString('vi-VN') + ' đ';

    function fmtDate(s) {
        if (!s || s.length < 14) return s;
        return `${s.substring(6,8)}/${s.substring(4,6)}/${s.substring(0,4)} ${s.substring(8,10)}:${s.substring(10,12)}:${s.substring(12,14)}`;
    }

    let isSuccess = responseCode === '00';
    let ipnError = null;

    // Xác thực và cập nhật DB qua IPN-like call (server sẽ verify chữ ký)
    if (isSuccess && txnRef) {
        try {
            const ipnRes = await fetch(`/api/payment/vnpay/ipn?${window.location.search.substring(1)}`);
            const ipnData = await ipnRes.json().catch(() => ({}));
            if (ipnData && ipnData.RspCode && ipnData.RspCode !== '00') {
                isSuccess = false;
                ipnError = ipnData.Message || 'Số lượng tồn kho không đủ hoặc xảy ra lỗi xác nhận đơn hàng';
            }
        } catch (e) { 
            console.warn('IPN call failed:', e); 
        }
    }

    // Hiển thị kết quả
    document.getElementById('loadingState').style.display = 'none';
    document.getElementById('resultState').style.display  = 'block';

    const iconCircle  = document.getElementById('iconCircle');
    const titleText   = document.getElementById('titleText');
    const subtitleText= document.getElementById('subtitleText');
    const infoRows    = document.getElementById('infoRows');

    if (isSuccess) {
        iconCircle.className = 'icon-circle success';
        iconCircle.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2.5"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>`;
        titleText.textContent    = 'Thanh toán thành công!';
        titleText.style.color    = '#0f172a';
        subtitleText.textContent = 'Giao dịch VNPay của bạn đã được xác nhận. Cảm ơn bạn đã mua hàng!';
        infoRows.innerHTML = `
            <div class="info-row"><span class="info-label">Mã đơn hàng</span><span class="info-value">${txnRef}</span></div>
            <div class="info-row"><span class="info-label">Mã giao dịch VNPay</span><span class="info-value">${transNo}</span></div>
            <div class="info-row"><span class="info-label">Số tiền</span><span class="info-value" style="color:#e53e3e;">${fmtAmount}</span></div>
            <div class="info-row"><span class="info-label">Ngân hàng</span><span class="info-value">${bankCode}</span></div>
            <div class="info-row"><span class="info-label">Thời gian</span><span class="info-value">${fmtDate(payDate)}</span></div>
        `;
    } else {
        iconCircle.className = 'icon-circle fail';
        iconCircle.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>`;
        const codeMsg = {
            '07': 'Giao dịch bị nghi ngờ gian lận',
            '09': 'Thẻ/Tài khoản chưa đăng ký dịch vụ InternetBanking',
            '10': 'Xác thực thông tin không thành công quá 3 lần',
            '11': 'Đã hết hạn chờ thanh toán',
            '12': 'Thẻ/Tài khoản bị khóa',
            '13': 'Sai mật khẩu OTP',
            '24': 'Khách hàng hủy giao dịch',
            '51': 'Tài khoản không đủ số dư',
            '65': 'Tài khoản vượt hạn mức giao dịch trong ngày',
            '75': 'Ngân hàng đang bảo trì',
            '79': 'Sai mật khẩu thanh toán quá số lần quy định',
            '99': 'Lỗi không xác định',
        };
        const msg = ipnError || codeMsg[responseCode] || `Lỗi mã: ${responseCode}`;
        titleText.textContent    = 'Thanh toán không thành công';
        titleText.style.color    = '#ef4444';
        subtitleText.textContent = msg + '. Vui lòng thử lại hoặc liên hệ hỗ trợ.';
        infoRows.innerHTML = `
            <div class="info-row"><span class="info-label">Mã đơn hàng</span><span class="info-value">${txnRef}</span></div>
            <div class="info-row"><span class="info-label">Chi tiết</span><span class="info-value" style="color:#ef4444;">${msg}</span></div>
        `;
    }
})();
</script>
</body>
</html>
