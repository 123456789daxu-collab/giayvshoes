spring.application.name=BE
server.port=8080
server.servlet.session.cookie.name=JSESSIONID_8080
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=VSHOES;encrypt=true;trustServerCertificate=true;sendStringParametersAsUnicode=true;characterEncoding=UTF-8
spring.datasource.username=sa
spring.datasource.password=123
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=true

# Tu dong quet va thuc thi file data.sql de khoi tao du lieu cho SQL Server
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql
spring.jpa.defer-datasource-initialization=true
spring.sql.init.continue-on-error=true
spring.sql.init.encoding=UTF-8




# Cau hinh kich thuoc toi da cho file upload va form post (anh san pham) - 100MB
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
spring.servlet.multipart.enabled=true
server.tomcat.max-swallow-size=100MB
server.tomcat.max-http-form-post-size=100MB
# Tat Cache Thymeleaf de code khong bi luu bo nho tam
spring.thymeleaf.cache=false

# Force UTF-8 Encoding
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.servlet.content-type=text/html;charset=UTF-8

